# ─────────────────────────────────────────────────────────────
# services/frontend/nginx.conf
# ─────────────────────────────────────────────────────────────
# Nginx sert les fichiers statiques ET proxifie les appels API
# vers les services Kubernetes internes.
# Cela évite les problèmes CORS : le navigateur appelle /api/*
# sur le même domaine, nginx transfère vers le bon service.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/html text/css application/javascript;

    # Sert les fichiers statiques
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy predict → inference-svc:8000
    location /predict {
        proxy_pass http://inference-svc:8000/predict;
        proxy_set_header Content-Type application/json;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Proxy metrics → monitoring-svc:8002
    location /metrics {
        proxy_pass http://monitoring-svc:8002/metrics;
    }

    # Proxy reset → monitoring-svc:8002
    location /reset {
        proxy_pass http://monitoring-svc:8002/reset;
    }
}

# ─────────────────────────────────────────────────────────────
# .github/workflows/ci.yml — Pipeline CI/CD projet CPR
# ─────────────────────────────────────────────────────────────
# Se déclenche à chaque push sur main.
#
# Structure en 2 jobs séquentiels :
#   Job 1 : test  → lance pytest, vérifie couverture ≥ 80%
#                   BLOQUE si les tests échouent
#   Job 2 : build → construit et pousse les 3 images Docker Hub
#                   S'exécute UNIQUEMENT si job 1 est passé
#
# Secrets requis (Settings → Secrets → Actions) :
#   DOCKERHUB_USERNAME : cyndy155
#   DOCKERHUB_TOKEN    : token Docker Hub avec Read/Write/Delete
# ─────────────────────────────────────────────────────────────

name: CI/CD — Tests + Build + Push Docker Hub

on:
  push:
    branches:
      - main   # se déclenche uniquement sur la branche principale

jobs:

  # ───────────────────────────────────────────────────────────
  # Job 1 — Tests
  # Lance pytest avec mesure de couverture.
  # Le pipeline échoue si couverture < 80%.
  # ───────────────────────────────────────────────────────────
  test:
    name: Tests (couverture ≥ 80%)
    runs-on: ubuntu-latest

    steps:
      # Récupère le code du repo
      - name: Checkout du code
        uses: actions/checkout@v4

      # Installe Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache pip pour accélérer les runs suivants
      - name: Cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/preprocessing/requirements.txt', 'services/inference/requirements.txt') }}

      # Installe les dépendances des 2 services testés
      - name: Installation des dépendances
        run: |
          pip install \
            fastapi==0.111.0 \
            uvicorn==0.29.0 \
            pydantic==2.7.1 \
            httpx==0.27.0 \
            joblib==1.4.2 \
            scikit-learn==1.4.2 \
            xgboost==2.0.3 \
            pandas==2.2.2 \
            numpy==1.26.4 \
            pytest==7.4.4 \
            pytest-cov==5.0.0 \
            anyio==4.2.0

      # Lance les tests avec mesure de couverture
      # --cov-fail-under=80 → le job échoue si couverture < 80%
      # Cela empêche le job build de se lancer
      - name: Lancement des tests pytest
        run: |
          pytest tests/ \
            --cov=services/preprocessing \
            --cov=services/inference \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ───────────────────────────────────────────────────────────
  # Job 2 — Build + Push Docker Hub
  # Construit les 3 images et les pousse sur Docker Hub.
  # Ne s'exécute QUE si le job test est passé (needs: test).
  # ───────────────────────────────────────────────────────────
  build:
    name: Build + Push images Docker Hub
    runs-on: ubuntu-latest
    needs: test   # dépend du succès du job test

    steps:
      # Récupère le code du repo
      - name: Checkout du code
        uses: actions/checkout@v4

      # Connexion à Docker Hub avec les secrets GitHub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Image monitoring ───────────────────────────────────
      - name: Build + Push monitoring
        uses: docker/build-push-action@v5
        with:
          # context = dossier du service
          context: ./services/monitoring
          # file = chemin exact du Dockerfile (paramètre correct pour v5)
          file: ./services/monitoring/Dockerfile
          push: true
          # Tag de version : 1.0.0 + tag "latest"
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/monitoring-cpr:1.0.0
            ${{ secrets.DOCKERHUB_USERNAME }}/monitoring-cpr:latest

      # ── Image preprocessing ────────────────────────────────
      - name: Build + Push preprocessing
        uses: docker/build-push-action@v5
        with:
          context: ./services/preprocessing
          # file = chemin exact du Dockerfile (paramètre correct pour v5)
          file: ./services/preprocessing/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/preprocessing-cpr:1.0.0
            ${{ secrets.DOCKERHUB_USERNAME }}/preprocessing-cpr:latest

      # ── Image inference ────────────────────────────────────
      # IMPORTANT : context = racine du projet (.)
      # car le Dockerfile copie models/ qui est à la racine
      - name: Build + Push inference
        uses: docker/build-push-action@v5
        with:
          context: .
          # file = chemin exact du Dockerfile (paramètre correct pour v5)
          file: ./services/inference/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/inference-cpr:1.0.0
            ${{ secrets.DOCKERHUB_USERNAME }}/inference-cpr:latest